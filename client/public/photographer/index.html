<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Photography — Asaduzzaman Sumon</title>

    <!-- Preloads & Styles -->
    <link rel="preload" href="../fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />

    <!-- Metadata -->
    <meta
      name="description"
      content="A wall of photographs by Asaduzzaman Sumon: portraits, events and street photography you can drag through in any direction."
    />
    <meta name="theme-color" content="#030303" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="author" content="Asaduzzaman Sumon" />
    <link rel="canonical" href="https://asadsumon.eu.cc/photographer/" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Asaduzzaman Sumon" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://asadsumon.eu.cc/photographer/" />
    <meta property="og:title" content="Photography — Asaduzzaman Sumon" />
    <meta
      property="og:description"
      content="A wall of photographs by Asaduzzaman Sumon: portraits, events and street photography you can drag through in any direction."
    />
    <meta property="og:image" content="https://asadsumon.eu.cc/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Asaduzzaman Sumon's portfolio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Photography — Asaduzzaman Sumon" />
    <meta
      name="twitter:description"
      content="A wall of photographs by Asaduzzaman Sumon: portraits, events and street photography you can drag through in any direction."
    />
    <meta name="twitter:image" content="https://asadsumon.eu.cc/og.jpg" />

    <!-- Embed & Theme Pre-check -->
    <script>
      document.documentElement.classList.add('pre');
      if (/[?&]embed\b/.test(location.search)) {
        document.documentElement.classList.add('embed');
      }
      try {
        if (localStorage.getItem('sumon-mode') === 'dark') {
          document.documentElement.dataset.mode = 'dark';
        }
      } catch {}
    </script>
  </head>

  <body>
    <main id="wallMain" style="display: contents;">
      <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0);">
        Photography by Sumon
      </h1>

      <!-- Deep space parallax starfield canvas -->
      <canvas class="sky" id="sky" aria-hidden="true"></canvas>

      <!-- Infinite pan/drag wall -->
      <div
        class="wall"
        id="wall"
        role="region"
        aria-label="Photos floating in the dark. Drag, scroll or use the arrow keys to move around, then press Enter to open the photo in the middle of the screen."
        tabindex="0"
      >
        <div class="space" id="space"></div>
      </div>

      <!-- Top Bar: Back Link & Title -->
      <div class="bar">
        <a class="chip" href="../#works" id="back" style="min-height: 44px;">← Back to the doors</a>
        <span class="chip chip--title">Photography</span>
      </div>

      <!-- Subtle Drag Hint -->
      <div class="chip hint" id="hint" aria-hidden="true">Drag in any direction</div>

      <!-- Lightbox Modal -->
      <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo" hidden>
        <img id="lbImg" alt="" />
        <button class="chip lb__close" id="lbClose">Close</button>
        <button class="chip lb__nav lb__nav--p" id="lbPrev" aria-label="Previous photo">←</button>
        <button class="chip lb__nav lb__nav--n" id="lbNext" aria-label="Next photo">→</button>
        <span class="chip lb__count" id="lbCount"></span>
      </div>
    </main>

    <!-- Photo Data Array -->
    <script src="photos.js"></script>

    <!-- Infinite Pan/Zoom Gallery Engine -->
    <script>
      (function () {
        'use strict';

        const EMBED = /[?&]embed\b/.test(location.search);
        const P = window.PHOTOS || [];
        const N = P.length;
        const root = document.documentElement;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const wall = document.getElementById('wall');
        const space = document.getElementById('space');

        let vw = window.innerWidth;
        let vh = window.innerHeight;
        let g = 28;
        let PW = 1800;
        let PH = 1800;
        let patch = [];
        let ROWS = null;

        function buildRows() {
          const mobile = vw < 640;
          const side = (mobile ? vw * 0.56 : Math.min(380, vh * 0.44)) * 0.93;
          const A = side * side;
          const minLen = vw * (mobile ? 2 : 1.7);
          const all = P.map((p, s) => {
            const r = p.w / p.h;
            const w = Math.sqrt(A * r);
            return { s, r, w, h: w / r, c: p.c || s };
          });

          const groups = [all.filter((o) => o.r < 1), all.filter((o) => o.r >= 1)].filter((gr) => gr.length);
          const made = [];

          for (const gr of groups) {
            gr.sort((a, b) => a.r - b.r);
            const total = gr.reduce((acc, o) => acc + o.w + g, 0);
            const n = Math.max(1, Math.min(gr.length, mobile ? Math.floor(total / minLen) : Math.round(total / minLen)));
            const target = total / n;
            const rowsOfGroup = Array.from({ length: n }, () => []);
            const len = new Array(n).fill(0);
            let cum = 0;

            for (const o of gr) {
              const nat = Math.min(n - 1, Math.floor(cum / target));
              cum += o.w + g;
              const cand = [...Array(n).keys()].sort((p, q) => Math.abs(p - nat) - Math.abs(q - nat));
              const score = (k) =>
                rowsOfGroup[k].filter((x) => x.c === o.c).length * 3 +
                Math.abs(k - nat) +
                (len[k] + o.w > target * 1.18 ? 9 : 0);
              const k = cand.reduce((best, k2) => (score(k2) < score(best) ? k2 : best), cand[0]);
              rowsOfGroup[k].push(o);
              len[k] += o.w + g;
            }
            made.push(rowsOfGroup);
          }

          const [a = [], b = []] = made;
          const seq = [];
          let ia = 0;
          let ib = 0;
          while (ia < a.length || ib < b.length) {
            if (ib >= b.length || (ia < a.length && ia / a.length <= ib / b.length)) {
              seq.push(a[ia++]);
            } else {
              seq.push(b[ib++]);
            }
          }

          let curY = 0;
          ROWS = seq.map((row, ri) => {
            const H = Math.max(...row.map((c) => c.h));
            let curX = 0;
            const cells = row.map((c) => {
              const x = curX;
              const y = (H - c.h) / 2;
              curX += c.w + g;
              return { s: c.s, x, y, w: c.w, h: c.h };
            });
            const out = { y: curY, H, L: curX, cells, off: (ri % 2) * (curX * 0.37) };
            curY += H + g;
            return out;
          });
          PH = curY;
        }

        function build() {
          vw = window.innerWidth;
          vh = window.innerHeight;
          g = vw < 640 ? 18 : 34;
          buildRows();
        }

        let camX = 0;
        let camY = 0;
        let vx = 0;
        let vy = 0;
        let dragging = false;
        let moved = 0;
        const live = new Map();
        const pool = [];

        const mod = (n, m) => ((n % m) + m) % m;

        function centre() {
          camX = 0;
          camY = 0;
        }

        function cellFor(key, s) {
          let el = live.get(key);
          if (el) return el;
          el = pool.pop() || (function () {
            const d = document.createElement('div');
            d.className = 'cell';
            d.innerHTML = '<div class="float"><div class="ph"><img alt="" decoding="async"></div></div>';
            const im = d.querySelector('img');
            im.onload = () => im.classList.add('ok');
            space.appendChild(d);
            return d;
          })();

          const ph = el.firstChild.firstChild;
          const im = ph.firstChild;
          const p = P[s];

          if (el.dataset.k !== key) {
            el.dataset.k = key;
            const r = (n) => {
              let h = 2166136261;
              for (const ch of key + n) h = Math.imul(h ^ ch.charCodeAt(0), 16777619);
              return ((h >>> 0) % 1000) / 1000;
            };
            const z = ROWS ? 1 : 0.86 + r('z') * 0.14;
            ph.style.setProperty('--z', z.toFixed(3));
            const fl = el.firstChild;
            const amp = ROWS ? 0.25 : 1;
            fl.style.setProperty('--fx', `${((r('x') - 0.5) * 14 * amp).toFixed(1)}px`);
            fl.style.setProperty('--fy', `${((r('y') - 0.5) * 18 * amp).toFixed(1)}px`);
            fl.style.setProperty('--fr', `${((r('r') - 0.5) * 1.4 * amp).toFixed(2)}deg`);
            fl.style.setProperty('--fd', `${(10 + r('d') * 8).toFixed(1)}s`);
            fl.style.setProperty('--fdl', `${(-r('l') * 18).toFixed(1)}s`);
          }

          if (el.dataset.s !== String(s)) {
            el.dataset.s = s;
            ph.style.backgroundImage = `url(${p.t}),url(${p.q})`;
            im.classList.remove('ok');
            im.src = p.t;
            if (im.complete && im.naturalWidth) im.classList.add('ok');
            else if (!booted) im.decoding = 'sync';
          }

          el.style.display = '';
          live.set(key, el);
          return el;
        }

        function render() {
          const seen = new Set();
          if (ROWS) {
            const iy0 = Math.floor((camY - 400) / PH);
            const iy1 = Math.floor((camY + vh) / PH);
            for (let iy = iy0; iy <= iy1; iy++) {
              ROWS.forEach((row, ri) => {
                const ry = row.y + iy * PH - camY;
                if (ry + row.H < -40 || ry > vh + 40) return;
                const base = camX + row.off;
                const ix0 = Math.floor((base - 400) / row.L);
                const ix1 = Math.floor((base + vw) / row.L);
                for (let ix = ix0; ix <= ix1; ix++) {
                  row.cells.forEach((c, k) => {
                    const x = c.x + ix * row.L - base;
                    const y = ry + c.y;
                    if (x + c.w < -40 || x > vw + 40) return;
                    const key = `${ix}:${iy}:${ri}:${k}`;
                    const el = cellFor(key, c.s);
                    el.style.width = `${c.w}px`;
                    el.style.height = `${c.h}px`;
                    el.style.transform = `translate3d(${x}px,${y}px,0)`;
                    if (arriving) {
                      const d =
                        Math.hypot(x + c.w / 2 - vw / 2, y + c.h / 2 - vh / 2) / Math.hypot(vw / 2, vh / 2);
                      el.firstChild.firstChild.style.setProperty(
                        '--dl',
                        `${(d * 0.22 + (seen.size % 5) * 0.02).toFixed(3)}s`
                      );
                    }
                    seen.add(key);
                  });
                }
              });
            }
            for (const [key, el] of live) {
              if (!seen.has(key)) {
                live.delete(key);
                el.style.display = 'none';
                pool.push(el);
              }
            }
            return;
          }
        }

        let tiltX = 0;
        let tiltY = 0;
        let mvx = 0;
        let mvy = 0;

        // Sky canvas parallax
        const sky = document.getElementById('sky');
        const sx = sky.getContext('2d');
        const TILE = 1600;
        const STARS = [];
        const NEB = [];

        (function seed() {
          let a = 987654321;
          const rnd = () => (
            (a = Math.imul(a ^ (a >>> 15), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909)),
            ((a >>> 0) % 1e6) / 1e6
          );
          for (let i = 0; i < 520; i++) {
            const m = Math.pow(rnd(), 3.2);
            STARS.push({
              x: rnd() * TILE,
              y: rnd() * TILE,
              a: 0.2 + m * 0.75,
              s: 0.7 + m * 1.5,
              w: rnd() < 0.12,
            });
          }
          const tones = ['196,176,176', '107,92,92', '150,128,140', '120,110,150'];
          for (let i = 0; i < 6; i++) {
            NEB.push({
              x: rnd() * TILE,
              y: rnd() * TILE,
              r: 260 + rnd() * 380,
              c: tones[i % 4],
              a: 0.07 + rnd() * 0.07,
            });
          }
        })();

        function sizeSky() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          sky.width = Math.round(window.innerWidth * dpr);
          sky.height = Math.round(window.innerHeight * dpr);
          sx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        let skyX = NaN;
        let skyY = NaN;
        function drawSky() {
          const ox = camX * 0.12;
          const oy = camY * 0.12;
          if (ox === skyX && oy === skyY) return;
          skyX = ox;
          skyY = oy;
          const w = window.innerWidth;
          const h = window.innerHeight;
          sx.globalCompositeOperation = 'source-over';
          sx.fillStyle = '#030306';
          sx.fillRect(0, 0, w, h);
          sx.globalCompositeOperation = 'lighter';
          const hx = camX * 0.06;
          const hy = camY * 0.06;

          for (const n of NEB) {
            for (let ix = -1; ix <= Math.ceil(w / TILE); ix++) {
              for (let iy = -1; iy <= Math.ceil(h / TILE); iy++) {
                const x = mod(n.x - hx, TILE) + ix * TILE;
                const y = mod(n.y - hy, TILE) + iy * TILE;
                if (x + n.r < 0 || y + n.r < 0 || x - n.r > w || y - n.r > h) continue;
                const g = sx.createRadialGradient(x, y, 0, x, y, n.r);
                g.addColorStop(0, `rgba(${n.c},${n.a})`);
                g.addColorStop(0.45, `rgba(${n.c},${n.a * 0.45})`);
                g.addColorStop(1, `rgba(${n.c},0)`);
                sx.fillStyle = g;
                sx.fillRect(x - n.r, y - n.r, n.r * 2, n.r * 2);
              }
            }
          }

          sx.fillStyle = '#fff';
          for (const st of STARS) {
            for (let ix = -1; ix <= Math.ceil(w / TILE); ix++) {
              for (let iy = -1; iy <= Math.ceil(h / TILE); iy++) {
                const x = mod(st.x - ox, TILE) + ix * TILE;
                const y = mod(st.y - oy, TILE) + iy * TILE;
                if (x < -2 || x > w + 2 || y < -2 || y > h + 2) continue;
                sx.globalAlpha = st.a;
                sx.beginPath();
                sx.arc(x, y, st.s, 0, Math.PI * 2);
                sx.fill();
              }
            }
          }
          sx.globalAlpha = 1;
        }

        let lastFrameTime = performance.now();
        function tick(now) {
          const dt = Math.min(64, now - lastFrameTime);
          lastFrameTime = now;
          if (!dragging) {
            if (Math.abs(vx) > 0.01 || Math.abs(vy) > 0.01) {
              camX += vx;
              camY += vy;
              vx *= 0.94;
              vy *= 0.94;
              render();
            }
          }
          drawSky();
          requestAnimationFrame(tick);
        }

        // Pointer drag & keyboard controls
        let px = 0;
        let py = 0;
        let downX = 0;
        let downY = 0;
        let samples = [];

        wall.addEventListener('pointerdown', (e) => {
          if (e.button !== 0) return;
          dragging = true;
          moved = 0;
          vx = vy = 0;
          px = downX = e.clientX;
          py = downY = e.clientY;
          samples = [{ x: px, y: py, t: e.timeStamp }];
          wall.setPointerCapture(e.pointerId);
          wall.classList.add('drag');
          hideHint();
        });

        wall.addEventListener('pointermove', (e) => {
          if (!dragging) return;
          const dx = e.clientX - px;
          const dy = e.clientY - py;
          px = e.clientX;
          py = e.clientY;
          camX -= dx;
          camY -= dy;
          mvx = -dx;
          mvy = -dy;
          moved = Math.max(moved, Math.hypot(px - downX, py - downY));
          samples.push({ x: px, y: py, t: e.timeStamp });
          if (samples.length > 6) samples.shift();
          render();
        });

        const endDrag = (e) => {
          if (!dragging) return;
          dragging = false;
          wall.classList.remove('drag');
          const a = samples[0];
          const b = samples[samples.length - 1];
          const dt = Math.max(1, b.t - a.t);
          if (b.t - a.t < 120 && !reduced) {
            vx = (-(b.x - a.x) / dt) * 16.67;
            vy = (-(b.y - a.y) / dt) * 16.67;
          }
          if (moved < 6) {
            const hit = document.elementsFromPoint(e.clientX, e.clientY).map((n) => n.closest?.('.cell')).find(Boolean);
            if (hit) openLb(+hit.dataset.s);
          }
        };

        wall.addEventListener('pointerup', endDrag);
        wall.addEventListener('pointercancel', endDrag);

        window.addEventListener(
          'wheel',
          (e) => {
            if (!lb.hidden) return;
            e.preventDefault();
            let dx = e.deltaX;
            let dy = e.deltaY;
            if (e.deltaMode === 1) {
              dx *= 32;
              dy *= 32;
            }
            if (e.shiftKey && !dx) {
              dx = dy;
              dy = 0;
            }
            camX += dx;
            camY += dy;
            vx = vy = 0;
            render();
            hideHint();
          },
          { passive: false }
        );

        window.addEventListener('keydown', (e) => {
          if (!lb.hidden) {
            if (e.key === 'Escape') closeLb();
            else if (e.key === 'ArrowRight') step(1);
            else if (e.key === 'ArrowLeft') step(-1);
            return;
          }
          const s = 22;
          const m = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
          if (m) {
            e.preventDefault();
            vx += m[0] * 0.5;
            vy += m[1] * 0.5;
            hideHint();
          }
          if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === wall) {
            e.preventDefault();
            const hit = document
              .elementsFromPoint(window.innerWidth / 2, window.innerHeight / 2)
              .map((n) => n.closest?.('.cell'))
              .find(Boolean);
            if (hit) openLb(+hit.dataset.s);
            else hideHint();
          }
          if (e.key === 'Escape') leave();
        });

        // Lightbox dialog
        const lb = document.getElementById('lb');
        const lbImg = document.getElementById('lbImg');
        let cur = 0;

        function show(i) {
          cur = mod(i, N);
          const p = P[cur];
          lbImg.src = p.t;
          const full = new Image();
          full.decoding = 'async';
          full.src = p.f;
          full.onload = () => {
            if (cur === mod(i, N)) lbImg.src = p.f;
          };
          lbImg.alt = `Photo ${cur + 1} of ${N}`;
          document.getElementById('lbCount').textContent = `${cur + 1} / ${N}`;
          new Image().src = P[mod(cur + 1, N)].f;
        }

        function openLb(i) {
          show(i);
          lb.hidden = false;
          requestAnimationFrame(() => lb.classList.add('open'));
          document.getElementById('lbClose').focus();
        }

        function closeLb() {
          lb.classList.remove('open');
          setTimeout(() => {
            lb.hidden = true;
            wall.focus();
          }, 300);
        }

        const step = (d) => show(cur + d);
        document.getElementById('lbClose').onclick = closeLb;
        document.getElementById('lbPrev').onclick = () => step(-1);
        document.getElementById('lbNext').onclick = () => step(1);
        lb.addEventListener('click', (e) => {
          if (e.target === lb) closeLb();
        });

        function leave() {
          if (EMBED) {
            parent.postMessage({ wall: 'close' }, window.location.origin === 'null' ? '*' : window.location.origin);
          } else {
            window.location.href = document.getElementById('back').href;
          }
        }

        document.getElementById('back').addEventListener('click', (e) => {
          if (EMBED) {
            e.preventDefault();
            leave();
          }
        });

        const hint = document.getElementById('hint');
        let hinted = false;
        function hideHint() {
          if (!hinted) {
            hinted = true;
            hint.classList.add('gone');
          }
        }
        setTimeout(hideHint, 6000);

        window.addEventListener('resize', () => {
          sizeSky();
          skyX = NaN;
          const cx = camX + vw / 2;
          const cy = camY + vh / 2;
          build();
          camX = cx - vw / 2;
          camY = cy - vh / 2;
          render();
        });

        let booted = false;
        let arriving = true;
        sizeSky();
        build();
        centre();
        render();
        booted = true;
        requestAnimationFrame(tick);

        function arrive() {
          arriving = false;
          root.classList.remove('instant');
          requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('pre')));
        }

        const firstImgs = [...document.querySelectorAll('.cell img')];
        const decoded = Promise.race([
          Promise.all(firstImgs.map((im) => im.decode?.().then(() => im.classList.add('ok')).catch(() => {}))),
          new Promise((r) => setTimeout(r, 1500)),
        ]);
        if (!EMBED) {
          decoded.then(arrive);
          wall.focus({ preventScroll: true });
        }
      })();
    </script>

    <!-- Shared Room Navigation & Controller -->
    <script src="../room-core.js" defer></script>
  </body>
</html>
